name: Game smoke tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

      - name: Run mobile browser smoke test
        run: npm run test:browser

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nothing-browser-failure
          path: test-failure.png
          if-no-files-found: ignore
