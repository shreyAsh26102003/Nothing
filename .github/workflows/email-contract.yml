name: After All email capture contract
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/test-email-capture.mjs'
      - '.github/workflows/email-contract.yml'
jobs:
  live-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify consent, unconfigured delivery and cleanup
        run: node scripts/test-email-capture.mjs
