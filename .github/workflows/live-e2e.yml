name: Nothing. live end-to-end
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/live-e2e.mjs
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify score journey and remove temporary data
        run: node scripts/live-e2e.mjs
