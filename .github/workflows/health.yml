name: After All production health
# Check the live deployment independently of commits.
# Vercel is currently deployed manually, so main-branch pushes can precede deployment.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: live-health
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployed game and leaderboard
        run: node scripts/health-check.mjs
