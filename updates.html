<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff0d4"><title>Hear from After All — Nothing.</title><link rel="stylesheet" href="/styles.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"></head>
<body style="overflow:auto;min-height:100dvh"><main class="overlay" style="position:relative;min-height:100dvh"><section class="panel"><div class="kicker">AFTER ALL</div><h2>Something's coming.</h2><p>Want to hear when it's ready? Leave your email. This is separate from playing Nothing. and joining the leaderboard.</p>
<form id="updatesForm" style="display:grid;gap:14px;text-align:left;margin:20px 0"><label style="font-weight:700">Email address<input type="email" id="email" autocomplete="email" required maxlength="254" placeholder="you@example.com" style="margin-top:8px;display:block;width:100%;border:2px solid #2b1b28;border-radius:12px;padding:13px"></label><label style="display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.5"><input required id="consent" type="checkbox" style="margin-top:4px">I agree to receive occasional emails about After All. I can unsubscribe later.</label><button class="btn" id="join" type="submit">KEEP ME POSTED</button></form>
<p role="status" aria-live="polite" id="status" class="subtle"></p><p class="subtle">No verification code is required. Your email won't be used for game rankings or prizes.</p><p><a href="/" class="text-button">Back to Nothing.</a> · <a href="/privacy.html" class="text-button">Privacy</a></p></section></main>
<script>
const API='https://scgihelnwihjckzzvxyc.supabase.co/functions/v1/nothing-game';
function getGuest(){try{return JSON.parse(localStorage.getItem('nothing-guest-v2')||'null')}catch{return null}}
document.getElementById('updatesForm').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('join'),status=document.getElementById('status');btn.disabled=true;status.textContent='Adding you…';try{let g=getGuest();if(!g?.token){const r=await fetch(API+'?action=register',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error('Could not connect');g=await r.json();localStorage.setItem('nothing-guest-v2',JSON.stringify(g))}const response=await fetch(API+'?action=waitlist',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+g.token},body:JSON.stringify({email:document.getElementById('email').value,consent:document.getElementById('consent').checked})});const data=await response.json();if(!response.ok)throw Error(data.error||'Could not save email');status.textContent=data.already?'You are already on the list.':'You are on the list. We will write when there is news worth sharing.';document.getElementById('updatesForm').hidden=true}catch(err){status.textContent=err.message||'Could not save your email.'}finally{btn.disabled=false}};
</script></body></html>
