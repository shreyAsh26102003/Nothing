name: Nothing live score journey
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/live-flow.mjs'
      - '.github/workflows/live-flow.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test live registration, 3 misses, score, leaderboard and deletion
        run: node scripts/live-flow.mjs
